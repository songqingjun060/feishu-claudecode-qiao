[feishu]
app_id = "cli_xxxxx"
app_secret = ""
domain = "https://open.feishu.cn"
gateway_backend = "current"
event_backend = "start_ws"

[claude]
command = "claude"
work_dir = "."
permission_mode = "safe"
# oneshot：每条消息调用一次 Claude CLI，最稳定。
# persistent：使用 claude-agent-sdk 为对话保留常驻 Claude worker，缺少 SDK 或 worker 出错时自动回退 oneshot。
runner = "oneshot"
worker_idle_ttl_seconds = 900
max_workers = 3
# 留空表示所有对话都可使用 persistent；填写 chat_id 或 session_key 表示只对指定对话启用。
persistent_enabled_chats = []

[whisper]
model = "base"
load_policy = "lazy"  # preload / lazy / per_call

[bridge]
data_dir = "./data"
log_level = "INFO"
max_upload_mb = 20
require_mention_in_group = true
bot_display_name = ""
personal_permission_profile = "admin"
ws_profile = "qiao-test"
ws_watchdog_interval_seconds = 30
ws_max_restart_failures = 3
console_message_log = true
console_claude_stream = true
queue_notice_after_seconds = 8
media_batch_window_seconds = 10
# 同一聊天窗口内的连续文本消息会先等这个窗口再合并成一次 Claude 调用。
# 设为 0 可关闭合并；图片/文件/语音不会被吞并，会继续按顺序处理并进入上下文。
message_coalesce_window_seconds = 10
progress_cards = false
fast_tasks_enabled = true
# 如果 bot_admins 为空，只有 bot_owner_id 能修改群规则。
bot_owner_id = ""
bot_admins = []

[security]
allowed_paths = []
blocked_keywords = []

# 会话翻页和长期记忆策略目前来自默认会话规则和按会话规则文件。
# 当前全局配置加载器不会读取单独的 [context_policy] 或 [memory_policy] 表；
# 因此这里保留为注释示例，避免复制后误以为全局配置已经生效。
#
# context_policy 示例：
# mode = "auto_rollover"
# score_threshold = 100
# soft_message_limit = 80
# hard_message_limit = 120
# ttl_hours = 168
# min_messages_between_rollovers = 30
# rollover_cooldown_hours = 12
# carry_summary = true
# context_error_only = false
#
# memory_policy 示例：
# enabled = true
# rolling_summary_max_chars = 6000
# history_max_items = 50
# history_item_max_chars = 4000
# inject_max_chars = 4000
#
# session_strategy 示例：
# mode = "auto"  # auto / light / work / fresh / stateless
# light_text_max_chars = 120
