# 会话翻页和长期记忆策略目前来自默认会话规则和按会话规则文件。
# 当前全局配置加载器不会读取单独的 [context_policy] 或 [memory_policy] 表；
# 因此这里保留为注释示例，避免复制后误以为全局配置已经生效。
#
# context_policy 示例：
# mode = "auto_rollover"
# score_threshold = 40
# soft_message_limit = 30
# hard_message_limit = 60
# ttl_hours = 72
# min_messages_between_rollovers = 20
# rollover_cooldown_hours = 4
# carry_summary = true
# context_error_only = false
#
# memory_policy 示例：
# enabled = true
# rolling_summary_max_chars = 6000
# history_max_items = 50
# history_item_max_chars = 4000
# inject_max_chars = 4000
#
# session_strategy 示例：
# mode = "auto"  # auto / light / work / fresh / stateless
# auto 模式默认按 chat 续用 session；不会因为短文本自动切 light。
