[feishu]
app_id = "cli_xxxxx"
app_secret = ""
domain = "https://open.feishu.cn"
gateway_backend = "current"
event_backend = "start_ws"

[claude]
command = "claude"
work_dir = "."
permission_mode = "safe"
# oneshot: 每条消息调用一次 Claude CLI，最稳定。
# persistent: SDK-backed 实验加速模式，为对话保留常驻 Claude worker；SDK 或 worker 出错时自动回退 oneshot。
runner = "oneshot"
worker_idle_ttl_seconds = 900
max_workers = 3
# 留空表示所有对话都可使用 persistent；填写 chat_id 或 session_key 表示只对指定对话启用。
persistent_enabled_chats = []

[whisper]
model = "base"
# preload: 桥启动时加载 Whisper；lazy: 首次语音时加载；per_call: 每条语音临时加载。
load_policy = "preload"

[bridge]
data_dir = "./data"
log_level = "INFO"
max_upload_mb = 20
require_mention_in_group = true
bot_display_name = ""
personal_permission_profile = "admin"
ws_profile = "qiao-test"
ws_watchdog_interval_seconds = 30
ws_max_restart_failures = 3
console_message_log = true
console_claude_stream = true
queue_notice_after_seconds = 8
media_batch_window_seconds = 10
# 普通文本连续发送时使用较短合并窗口，降低简单问答等待。
text_coalesce_window_seconds = 2
# 图片、文件、语音等媒体上下文保留较长窗口，便于批处理。
message_coalesce_window_seconds = 10
progress_cards = false
fast_tasks_enabled = true
# 如果 bot_admins 为空，只有 bot_owner_id 能修改群规则。
bot_owner_id = ""
bot_admins = []

[security]
allowed_paths = []
blocked_keywords = []

# 本地工具快速路径示例：
# 桥只负责按关键词/正则命中、执行本地命令、解析 stdout，并上传命令返回的附件路径。
# 具体业务逻辑应放在你自己的本地工具里，不需要提交到这个桥项目。
#
# [[local_tools]]
# name = "sample_lookup"
# enabled = true
# keywords = ["查询", "lookup"]
# match_patterns = ["\\b[A-Z]{2}\\d{4}\\b"]
# command = ["python", "lookup.py", "--ids", "{matches}", "--text", "{content}"]
# cwd = "D:/your-local-tool"
# timeout_seconds = 180
# attachment_path_fields = ["attachment_path", "file_path", "excelFilePath", "excel_path"]
# summary_fields = ["summary", "message", "text"]
# context_label = "sample lookup result"
# prompt_hint = "When the user asks to extract IDs from recent images or files, read the media/file context, extract all IDs, deduplicate them, run command_template once with every ID, and upload any returned attachment path."

# 会话翻页和长期记忆策略目前来自默认会话规则和按会话规则文件。
# 当前全局配置加载器不会读取单独的 [context_policy] 或 [memory_policy] 表；
# 因此这里保留为注释示例，避免复制后误以为全局配置已经生效。
#
# context_policy 示例：
# mode = "auto_rollover"
# score_threshold = 100
# soft_message_limit = 80
# hard_message_limit = 120
# ttl_hours = 168
# min_messages_between_rollovers = 30
# rollover_cooldown_hours = 12
# carry_summary = true
# context_error_only = false
#
# memory_policy 示例：
# enabled = true
# rolling_summary_max_chars = 6000
# history_max_items = 50
# history_item_max_chars = 4000
# inject_max_chars = 4000
#
# session_strategy 示例：
# mode = "auto"  # auto / light / work / fresh / stateless
# light_text_max_chars = 120
